.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:680px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.04em}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--muted);font-size:15px}

.wrap{max-width:680px;margin:0 auto;padding:20px 20px calc(120px + env(safe-area-inset-bottom,0px))}

/* trail */
.trail{display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap;font-size:13px;color:var(--muted);margin:0 -4px 8px;padding:2px 4px;scrollbar-width:none}

.trail button{background:none;border:0;padding:2px 4px;color:var(--muted);border-radius:4px}
.trail button[aria-current="true"]{color:var(--ink);font-weight:600}
.trail .sep{opacity:.5;padding:0 2px}

/* card */
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font-size:13px;margin-top:12px}
.meta .field{color:var(--accent);font-weight:500}
.meta .en{color:var(--muted);font-style:italic}

h1.title{font-family:var(--serif);font-weight:700;font-size:clamp(26px,6.4vw,32px);line-height:1.3;margin:6px 0 20px;letter-spacing:.01em}

.term{background:none;border:0;padding:0 1px;font:inherit;color:var(--ink);border-bottom:1.5px solid var(--accent);border-radius:2px;line-height:inherit}
.term:hover,.term:active{background:var(--accent-soft)}
.why{margin:24px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--accent);font-size:14.5px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.sources{margin:14px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}

.section-h{font-size:14px;font-weight:600;color:var(--muted);margin:36px 0 4px}
.rows{border-top:1px solid var(--rule)}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 2px}

/* states */
.empty{padding:48px 0 24px}
.empty h2{font-family:var(--serif);font-size:24px;line-height:1.4;margin:0 0 10px}

.loading{padding:40px 0}

.pulse{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;max-width:320px}
.pulse::after{content:"";display:block;height:100%;width:35%;background:var(--accent);border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

.btn{border:0;border-radius:10px;padding:11px 18px;font-size:15.5px;font-weight:600;background:var(--accent);color:var(--accent-ink)}

.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.actions-in{max-width:680px;margin:0 auto;padding:0 20px;display:flex;gap:8px}

/* settings */
.group{padding:20px 0;border-bottom:1px solid var(--rule)}
.group:last-child{border-bottom:0}

.field-row{display:flex;gap:8px}
.input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.models{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}

/* knowledge map */
body.maponly{overflow:hidden;overscroll-behavior:none}

.map{position:absolute;inset:0}
.mapsvg{display:block;touch-action:none;cursor:grab;--fs:1}
.mapsvg .ring{fill:none;stroke:var(--rule);stroke-width:1;stroke-dasharray:2 5;vector-effect:non-scaling-stroke}
.mapsvg .link{fill:none;stroke:hsl(var(--h) var(--s) var(--L));stroke-width:1.6;stroke-opacity:.8;vector-effect:non-scaling-stroke}
.mapsvg .link.off{stroke:var(--rule);stroke-opacity:1;stroke-dasharray:3 4}
.mapsvg .node{cursor:pointer}
.mapsvg .node .dot{fill:hsl(var(--h) var(--s) var(--L));stroke:var(--bg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mapsvg .node.off .dot{fill:var(--bg);stroke:var(--rule)}
.mapsvg .node.saved .dot{fill:var(--bg);stroke:hsl(var(--h) var(--s) var(--L));stroke-width:2.5}

.mapsvg .node.sub text{font-size:calc(11px * var(--fs))}
.mapsvg .node.card text{font-size:calc(10.5px * var(--fs));font-family:var(--serif)}
.mapsvg .node.off text{fill:var(--muted)}
.mapsvg.far .node.card text{display:none}
.mapbar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.mapbar .stat{font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:4px 8px;border-radius:8px}

.maperr{padding:40px 20px;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.10);max-height:62dvh;overflow-y:auto;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:680px;margin:0 auto;padding:0 20px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h3{font-family:var(--serif);font-size:21px;margin:0}
.sheet .sub{font-size:13.5px;color:var(--muted);margin:2px 0 12px}
.sheet .x{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 2px}
.sheet .go{width:100%;margin:4px 0 8px}
.stub{color:var(--muted);margin:8px 0 20px}

/* ask panel：占螢幕下半部，上方文章可繼續閱讀 */
:root{--askh:50dvh}
body.asking .wrap{padding-bottom:calc(var(--askh) + 24px)}
.askwrap{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}

.msg.user{align-self:flex-end;background:var(--accent-soft);padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:85%;white-space:pre-wrap;font-size:15.5px}

.ask-foot{border-top:1px solid var(--rule);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.ctx{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.ctx input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* feedback faces */

/* model picker */

.quota{margin-top:14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}

/* theme + references */

@media (prefers-reduced-motion: reduce){.pulse::after{animation:none;width:100%}.toast{transition:none}}

<script>
(() => {
const API = 'https://generativelanguage.googleapis.com/v1beta';
const DEFAULT_MODEL = 'gemini-3.5-flash-lite';
// 免費額度：Google 未公開固定數值，以下 RPD 為 2026 年 9 月第三方整理的參考值，實際以 AI Studio 顯示為準

const FIELDS = {

  .map(([cat, subs]) => `${cat}（包含：${subs.join('、')}）`)
  .join('；');

(function classify(){
  const REN = { '生命科學':'生物學' };
  state.settings.fields = (state.settings.fields || []).map(f => REN[f] || f).filter(f => FIELDS[f]);
  const subs = Object.entries(FIELDS).flatMap(([cat, arr]) => arr.map(sub => ({ cat, sub })));
  let changed = false;
  const cards = Object.values(state.cards);
  for (const c of cards){
    if (c.cat && REN[c.cat]){ c.cat = REN[c.cat]; changed = true; }
    if (c.cat !== undefined || (c.parentId && state.cards[c.parentId])) continue;
    const text = (c.field || '') + ' ' + (c.title || '');
    const hit = subs.find(x => text.includes(x.sub));
    if (hit){ c.cat = hit.cat; c.sub = hit.sub; }
    else {
      const ALIAS = { '數學':['數學'], '物理':['物理'], '化學':['化學'], '生物學':['生物','生命科學'], '醫學':['醫學','藥'],
        '地球與太空':['地球','地質','天文','太空','行星'], '工程':['工程','材料'], '資訊':['資訊','計算機','電腦','演算'],
        '統計':['統計'], '經濟與金融':['經濟','金融','社會選擇'], '社會科學':['社會','政治','人類學'],
        '心理與認知':['心理','認知'], '語言學':['語言'], '哲學與邏輯':['哲學','邏輯'],
        '歷史與考古':['歷史','考古'], '藝術與音樂':['藝術','音樂','建築'] };
      c.cat = Object.keys(ALIAS).find(k => ALIAS[k].some(w => text.includes(w))) || '未分類'; c.sub = null;
    }
    changed = true;
  }
  const resolve = (c, depth) => {
    if (c.cat !== undefined) return;
    const p = state.cards[c.parentId];
    if (p && depth < 60){ resolve(p, depth + 1); c.cat = p.cat; c.sub = p.sub; }
    else { c.cat = '未分類'; c.sub = null; }
    changed = true;
  };
  cards.forEach(c => resolve(c, 0));
  if (changed){ store.set('kx_cards', state.cards); store.set('kx_settings', state.settings); }
})();

// 把另一份備份（雲端或檔案）合併進目前資料；同一張卡片以較新的修改為準
function mergeBackup(data){
  if (!data || typeof data.cards !== 'object') throw new Error('備份內容格式不正確。');
  let added = 0, changed = false, keyRestored = false;
  if (data.geminiKey && (!state.settings.key.trim() || (data.keyAt || 0) > (state.settings.keyAt || 0))
      && data.geminiKey !== state.settings.key.trim()){
    state.settings.key = data.geminiKey; state.settings.keyAt = data.keyAt || 0;
    saveSettings(); keyRestored = true; changed = true;
  }
  for (const [id, rc] of Object.entries(data.cards)){
    if (!rc || !rc.id) continue;
    const lc = state.cards[id];
    if (!lc){ state.cards[id] = rc; added++; changed = true; continue; }
    const lt = lc.updatedAt || lc.createdAt || 0, rtm = rc.updatedAt || rc.createdAt || 0;
    let win = rtm > lt ? rc : lc;
    const other = win === rc ? lc : rc;
    if (win.stub && !other.stub){
      win = Object.assign({}, win, { body:other.body, terms:other.terms, sources:other.sources, consensus:other.consensus });
      delete win.stub;
    }
    if (win !== lc){ state.cards[id] = win; changed = true; }
  }
  const rlog = data.savedLog || {};
  for (const [id, entry] of Object.entries(rlog)){
    if (!state.savedLog[id] || entry.t > state.savedLog[id].t) state.savedLog[id] = entry;
  }
  const before = state.saved.join(',');
  let saved = [...new Set([...state.saved, ...(data.saved || [])])];
  for (const [id, entry] of Object.entries(state.savedLog)){
    if (entry.on && !saved.includes(id)) saved.push(id);
    if (!entry.on) saved = saved.filter(x => x !== id);
  }
  state.saved = saved.filter(id => state.cards[id]);
  if (state.saved.join(',') !== before) changed = true;
  state.seen = [...new Set([...state.seen, ...(data.seen || [])])];
  for (const [k, v] of Object.entries(data.termIndex || {})) if (!state.termIndex[k] && state.cards[v]) state.termIndex[k] = v;
  if ((data.biasAt || 0) > state.biasAt){ state.bias = data.bias || {}; state.biasAt = data.biasAt; changed = true; }
  rt.applying = true; persist(); rt.applying = false;
  return { added, changed, keyRestored };
}

async function driveFetch(url, opts = {}){
  let res;
  try{
    res = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization:'Bearer ' + rt.token }, opts.headers || {}) }));
  }catch{ throw new Error('無法連線到 Google Drive，請確認網路連線。'); }
  if (res.status === 401){ rt.token = null; throw new Error('Google 登入已過期，請再按一次「立即同步」。'); }
  if (!res.ok){
    let msg = res.statusText;
    try{ msg = (await res.json()).error.message; }catch{}
    if (res.status === 403) throw new Error('Google Drive 拒絕存取。請確認已在 Cloud Console 啟用 Google Drive API：' + msg);
    throw new Error(`Google Drive 錯誤（${res.status}）：${msg}`);
  }
  return res;
}

async function driveSync(silent){
  if (rt.busy || !tokenValid()) return;
  rt.busy = true; clearTimeout(rt.timer);
  if (!silent) safeRender();
  let result = { added:0, changed:false };
  try{
    const q = encodeURIComponent(`name='${DRIVE_FILE}'`);
    const list = await (await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc&pageSize=1`)).json();
    const file = list.files && list.files[0];
    if (file){
      const remote = await (await driveFetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`)).json();
      result = mergeBackup(remote);
    }
    const body = JSON.stringify(snapshot(true));
    if (file){
      await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media`, {
        method:'PATCH', headers:{ 'Content-Type':'application/json' }, body });
    } else {
      const b = 'kx' + uid();
      const meta = { name:DRIVE_FILE, parents:['appDataFolder'], mimeType:'application/json' };
      await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST', headers:{ 'Content-Type':`multipart/related; boundary=${b}` },
        body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--` });
    }
    state.drive.connected = true; state.drive.lastSync = Date.now(); saveDrive();
    rt.dismissed = true;
    if (result.keyRestored) toast('已從 Google Drive 取回 Gemini 金鑰' + (result.added ? `與 ${result.added} 張卡片` : ''));
    else if (!silent) toast(result.added ? `已同步，從雲端取回 ${result.added} 張卡片` : '已和 Google Drive 同步');
  }catch(e){
    toast(e.message);
  }finally{
    rt.busy = false;
    if (result.keyRestored) render();
    else if (!silent || result.changed) safeRender();
  }
}

// ---------- 難度（以大領域為單位）----------
const baseIdx = () => { const i = LEVELS.indexOf(state.settings.level); return i < 0 ? 2 : i; };
const clampIdx = i => Math.max(0, Math.min(LEVELS.length - 1, i));
function levelFor(cat){ return LEVELS[clampIdx(baseIdx() + ((FIELDS[cat] && state.bias[cat]) || 0))]; }
function shiftBias(cat, step){
  const b = baseIdx();
  const now = clampIdx(b + (state.bias[cat] || 0));
  const next = clampIdx(now + step);
  if (next === b) delete state.bias[cat]; else state.bias[cat] = next - b;
  state.biasAt = Date.now();
}
function vote(c, dir){
  if (!c || !FIELDS[c.cat]){ toast('這張卡片沒有領域分類，無法調整難度'); return; }
  const prev = c.vote || 0;
  const next = prev === dir ? 0 : dir;
  if (next - prev) shiftBias(c.cat, next - prev);
  c.vote = next; c.updatedAt = Date.now();
  persist(); render();
  const lv = levelFor(c.cat);
  toast(next === 0 ? `已取消，${c.cat}目前難度：${lv}` : `下次的${c.cat}知識點會是「${lv}」程度`);
}

function lineage(id){
  const out = []; const seen = new Set();
  let c = state.cards[id];
  while (c && !seen.has(c.id)){ out.unshift(c.id); seen.add(c.id); c = state.cards[c.parentId]; }
  return out;
}

function normalize(raw, extra){
  const body = String(raw.body || '').trim();
  let terms = Array.isArray(raw.terms) ? raw.terms.filter(t => t && t.term).map(t => ({
    term:String(t.term).trim(), english:String(t.english || '').trim(), brief:String(t.brief || '').trim()
  })) : [];
  for (const m of body.matchAll(/\[\[(.+?)\]\]/g)){
    const name = m[1].trim();
    if (!terms.some(t => t.term === name)) terms.push({ term:name, english:'', brief:'' });
  }
  return Object.assign({
    id: uid(),
    title: String(raw.title || '').trim(),
    english: String(raw.english || '').trim(),
    field: String(raw.field || '').trim(),
    body, terms,
    consensus: String(raw.consensus || '').trim(),
    sources: Array.isArray(raw.sources) ? raw.sources.filter(s => s && s.title).slice(0, 4) : [],
    createdAt: Date.now(), doubt: false,
    model: state.lastModel || modelName(), fallback: !!state.lastFallback
  }, extra);
}

// ---------- Gemini ----------
function modelName(){ return (state.settings.model || DEFAULT_MODEL).trim().replace(/^models\//, ''); }

async function geminiRequest(payload, signal, model = modelName()){
  let res;
  try{
    res = await fetch(`${API}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(state.settings.key.trim())}`, {
      method:'POST', headers:{ 'Content-Type':'application/json' }, signal,
      body: JSON.stringify(payload)
    });
  }catch(e){
    if (e.name === 'AbortError') throw e;
    throw new Error('無法連線到 Gemini，請確認網路連線。');
  }
  let data = {};
  try{ data = await res.json(); }catch{}
  if (!res.ok){
    const msg = data?.error?.message || res.statusText;
    const fail = text => { const err = new Error(text); err.status = res.status; return err; };
    if (res.status === 429) throw fail(`已達 ${modelLabel(model)} 的免費額度上限（每分鐘或每日請求數），請稍後再試。`);
    if (res.status === 404) throw fail(`這組金鑰無法使用模型「${model}」，請到設定改選其他模型。`);
    if (/API key/i.test(msg) || res.status === 401 || res.status === 403) throw fail('API 金鑰無效或沒有權限，請到設定確認金鑰。');
    throw fail(`Gemini 回傳錯誤（${res.status}）：${msg}`);
  }
  const cand = data.candidates?.[0];
  const text = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  if (!text){
    const why = data.promptFeedback?.blockReason || cand?.finishReason || '未知原因';
    throw new Error(`沒有收到內容（${why}），請再試一次。`);
  }
  return text;
}

// 伺服器忙碌（5xx）時先重試，仍失敗或額度用完（429）就依序改用其他模型

const modelLabel = id => (MODELS.find(m => m.id === id)?.name || id).replace('Gemini ', '');
// ---------- 模型選擇與重試 ----------
const STRONG_LEVELS = ['博士', '專家'];
const STRONG_MODELS = ['gemini-3.8-flash', 'gemini-3.7-flash'];
function fallbackChain(level){
  const sel = modelName();
  if (STRONG_LEVELS.includes(level)){
    // 博士以上：只用 3.7 Flash 以上，絕不降級
    const first = STRONG_MODELS.includes(sel) ? sel : STRONG_MODELS[0];
    if (state.settings.autoFallback === false) return [first];
    return [first, ...STRONG_MODELS.filter(m => m !== first)];
  }
  if (state.settings.autoFallback === false) return [sel];
  const rest = sel === 'gemini-3.5-flash-lite' ? ['gemini-3.5-flash'] : ['gemini-3.7-flash', 'gemini-3.5-flash-lite'];
  return [sel, ...rest.filter(m => m !== sel)];
}
const sleep = (ms, signal) => new Promise((resolve, reject) => {
  const t = setTimeout(resolve, ms);
  if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('aborted', 'AbortError')); }, { once:true });
});

async function geminiSmart(payload, signal, onStatus, chain = fallbackChain(), strong = false){
  let lastErr;
  for (let i = 0; i < chain.length; i++){
    const model = chain[i];
    for (let attempt = 0; attempt < 3; attempt++){
      try{
        const text = await geminiRequest(payload, signal, model);
        state.lastModel = model; state.lastFallback = i > 0;
        if (i > 0) toast(`${modelLabel(chain[0])} 目前無法使用，這次改由 ${modelLabel(model)} 回答`);
        return text;
      }catch(e){
        if (e.name === 'AbortError') throw e;
        lastErr = e;
        if (RETRYABLE.has(e.status) && attempt < 2){
          if (onStatus) onStatus(`${modelLabel(model)} 目前忙碌，${attempt === 0 ? '稍後自動重試' : '再試一次'}…`);
          await sleep(attempt === 0 ? 2000 : 5000, signal);
          continue;
        }
        break;
      }
    }
    const canFallback = lastErr && (RETRYABLE.has(lastErr.status) || lastErr.status === 429);
    if (!canFallback || i === chain.length - 1) break;
    if (onStatus) onStatus(`改用 ${modelLabel(chain[i + 1])}…`);
  }
  if (strong && lastErr && (RETRYABLE.has(lastErr.status) || lastErr.status === 429)){
    throw new Error('3.8 Flash 與 3.7 Flash 目前都無法使用（伺服器忙碌或今日額度已用完）。博士以上的內容只會由 3.7 Flash 以上的模型撰寫，請稍後再試，或用哭臉暫時調降這個領域的難度。');
  }
  if (lastErr && RETRYABLE.has(lastErr.status)){
    throw new Error(chain.length > 1
      ? 'Gemini 伺服器目前忙碌，已自動重試並改用其他模型，仍然無法完成，請稍後再試。'
      : `${modelLabel(chain[0])} 目前忙碌，重試後仍無法完成。可以稍後再試，或到設定開啟「忙碌時自動改用其他模型」。`);
  }
  throw lastErr;
}

// 數學內容常讓模型寫出未正確跳脫的反斜線（例如 \frac、\alpha），導致 JSON 解析失敗或公式被誤判成控制字元。
// 解析前先修補：LaTeX 指令與不合法的跳脫一律補成雙反斜線；已正確跳脫的不會重複處理。
function repairJSON(t){
  return t
    .replace(/(?<!\\)\\(?!u[0-9a-fA-F]{4})(?=[a-zA-Z]{2,})/g, '\\\\')
    .replace(/(?<!\\)\\(?!["\\/bfnrtu])/g, '\\\\');
}
function parseCard(text){
  const clean = text.replace(/```json|```/g, '').trim();
  const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  const raw = clean.slice(a, b + 1);
  for (const candidate of [repairJSON(raw), raw]){
    try{ return JSON.parse(candidate); }catch{}
  }
  console.warn('[知識探索] 無法解析的回傳內容：', text);
  return null;
}

async function callGemini(userText, signal, onStatus, level){
  const strong = STRONG_LEVELS.includes(level);
  // 格式錯誤時自動再請模型重寫一次
  for (let attempt = 0; attempt < 2; attempt++){
    const text = await geminiSmart({
      systemInstruction:{ parts:[{ text:SYSTEM }] },
      contents:[{ role:'user', parts:[{ text:userText }] }],
      generationConfig:{ responseMimeType:'application/json', temperature:0.4 }
    }, signal, onStatus, fallbackChain(level), strong);
    const obj = parseCard(text);
    if (obj && obj.title && obj.body) return obj;
    if (attempt === 0 && onStatus) onStatus('回傳格式有誤，正在請模型重新撰寫…');
  }
  throw new Error('模型連續兩次回傳的格式都有誤，請再試一次。若同一個名詞一直失敗，可能是來源中的數學式較複雜。');
}

// task(signal, status) 是一連串步驟：查來源、再請 Gemini 撰寫
async function run(task, loadingText, retry){
  if (state.loading) return null;
  state.loading = true; state.loadingText = loadingText; state.error = ''; state.retry = retry;
  state.controller = new AbortController();
  render();
  const status = msg => { state.loadingText = msg; render(); };
  try{
    const r = await task(state.controller.signal, status);
    state.loading = false; state.controller = null;
    return r;
  }catch(e){
    state.loading = false; state.controller = null;
    state.error = e.name === 'AbortError' ? '' : e.message;
    render();
    return null;
  }
}

async function getJSON(url, signal, label){
  let res;
  try{ res = await fetch(url, { signal }); }

const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

async function wikiSearch(q, limit, signal){
  const url = `${WIKI_API}?action=query&list=search&format=json&origin=*&srnamespace=0&srlimit=${limit}&srsearch=${encodeURIComponent(q)}`;
  const data = await getJSON(url, signal, '維基百科');
  return (data.query?.search || []).map(r => r.title).filter(t => !/^(List|Lists|Outline|Index|Glossary|Timeline) of /i.test(t));
}
async function wikiArticle(title, signal, badge){
  const url = `${WIKI_API}?action=query&prop=extracts|info&explaintext=1&exsectionformat=wiki&inprop=url&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title)}`;
  const data = await getJSON(url, signal, '維基百科');
  const page = Object.values(data.query?.pages || {})[0];
  if (!page || page.missing !== undefined || !page.extract) return null;
  let text = page.extract.split(/\n==+\s*(See also|References|Notes|Further reading|External links|Bibliography|Sources|Citations|Footnotes)\s*==+/i)[0];
  // 維基百科純文字中的數學式會以 {\displaystyle ...} 呈現，先轉成 $...$，減少模型處理反斜線出錯
  for (let i = 0; i < 3; i++) text = text.replace(/\{\\displaystyle\s*((?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*)\}/g, (m, x) => '$' + x.trim() + '$');
  text = text.replace(/\n{3,}/g, '\n\n').trim().slice(0, 12000);
  if (text.length < 600) return null;
  const name = page.title;
  return { kind:'wiki', key:'wiki:' + name, title:name, text,
    sources:[{ title:`Wikipedia：${name}`, author: badge || '', year:'', url: page.fullurl || `https://en.wikipedia.org/wiki/${encodeURIComponent(name.replace(/ /g, '_'))}` }] };
}

}

function oaAbstract(inv){
  if (!inv) return '';
  const words = [];
  for (const [w, pos] of Object.entries(inv)) for (const p of pos) words[p] = w;
  return words.filter(Boolean).join(' ');
}
function oaToSource(w, kind){
  const authors = (w.authorships || []).map(a => a.author?.display_name).filter(Boolean);
  const author = authors.length > 3 ? authors.slice(0, 3).join(', ') + ' et al.' : authors.join(', ');
  const venue = w.primary_location?.source?.display_name || '';
  const title = stripTags(w.display_name);
  return { kind, key:'oa:' + String(w.id).split('/').pop(), title,
    text: oaAbstract(w.abstract_inverted_index).slice(0, 3500),
    meta:{ authors: author, year: w.publication_year, venue, cited: w.cited_by_count },
    sources:[{ title, author, year: String(w.publication_year || ''), venue, cited: w.cited_by_count, url: w.doi || w.id }] };
}
async function oaWorks(q, recent, perPage, signal){
  const since = new Date(Date.now() - 3 * 365 * 864e5).toISOString().slice(0, 10);
  const filter = ['has_abstract:true', 'type:article|review', recent ? 'cited_by_count:>9' : 'cited_by_count:>200']
    .concat(recent ? [`from_publication_date:${since}`] : []).join(',');
  const select = 'id,display_name,publication_year,cited_by_count,doi,abstract_inverted_index,authorships,primary_location';
  const url = `${OA_API}/works?search=${encodeURIComponent(q)}&filter=${filter}&sort=cited_by_count:desc&per-page=${perPage}&select=${select}&mailto=${OA_MAIL}`;
  const data = await getJSON(url, signal, 'OpenAlex 學術資料庫');
  return (data.results || []).filter(w => w.abstract_inverted_index && w.primary_location?.source?.id);
}
// 以期刊的「兩年平均被引次數」作為影響係數（IF）的免費替代指標，保留前半段期刊
async function oaHighImpact(works, signal){
  const ids = [...new Set(works.map(w => String(w.primary_location.source.id).split('/').pop()))].slice(0, 50);
  if (!ids.length) return works;
  const url = `${OA_API}/sources?filter=openalex:${ids.join('|')}&select=id,summary_stats&per-page=50&mailto=${OA_MAIL}`;
  const data = await getJSON(url, signal, 'OpenAlex 學術資料庫');
  const m = {};
  for (const s of data.results || []) m[String(s.id).split('/').pop()] = s.summary_stats?.['2yr_mean_citedness'] || 0;
  const vals = Object.values(m).sort((a, b) => a - b);
  const median = vals.length ? vals[Math.floor(vals.length / 2)] : 0;
  const kept = works.filter(w => (m[String(w.primary_location.source.id).split('/').pop()] || 0) >= median);
  return kept.length ? kept : works;
}
async function paperPick(subEn, recent, signal){
  const seen = seenKeys();
  const works = await oaHighImpact(await oaWorks(subEn, recent, 50, signal), signal);
  const fresh = works.filter(w => !seen.has('oa:' + String(w.id).split('/').pop())).slice(0, 15);
  if (!fresh.length) throw new Error(`在 OpenAlex 找不到「${subEn}」${recent ? '近三年' : ''}適合的新論文，請再按一次換個領域。`);
  return oaToSource(pick(fresh), recent ? 'recent' : 'classic');
}

async function newPoint(opts = {}){
  const { cat, sub } = opts.cat && FIELDS[opts.cat]
    ? { cat: opts.cat, sub: opts.sub && FIELDS[opts.cat].includes(opts.sub) ? opts.sub : pick(FIELDS[opts.cat]) }
    : pickField();
  const lv = levelFor(cat);
  const mode = modeFor(lv);
  const r = await run(async (signal, status) => {
    const src = await getSource(mode, SUB_EN[sub] || sub, signal, status, false);
    status(`正在請 ${modelLabel(fallbackChain(lv)[0])} 根據來源撰寫…`);
    const obj = await callGemini(sourcePrompt(src, lv, { cat, sub }), signal, status, lv);
    return { obj, src };
  }, `正在從「${sub}」挑選知識點`, () => newPoint(opts));
  if (!r) return;
  
  // ✅ 驗證並修正分類
  let obj = r.obj;
  const [returnedCat, returnedSub] = (obj.field || '').split('／');
  
  if (!FIELDS[returnedCat] || !FIELDS[returnedCat].includes(returnedSub)) {
    // Gemini 填錯了，用我們決定的分類覆蓋
    obj.field = `${cat}／${sub}`;
    obj.cat = cat;
    obj.sub = sub;
    toast(`分類已校正為「${cat}／${sub}」`);
  }
  
  const card = normalize(obj, Object.assign({ kind:'point', parentId:null, cat, sub, level:lv }, sourcedExtra(r.src, mode)));
  addCard(card);
  state.seen.push(card.title);
  state.path = [card.id];
  persist(); render(); window.scrollTo(0, 0);
}

async function openTerm(term, english){
  const existing = state.termIndex[term];

  const parent = current();
  const lv = levelFor(parent ? parent.cat : '');
  const mode = modeFor(lv);
  const query = english || term;
  const r = await run(async (signal, status) => {
    const src = await getSource(mode, query, signal, status, true);
    if (!src){
      throw new Error(mode === 'wiki'
        ? `英文維基百科找不到「${term}」的條目。為了確保內容來自可信來源，這個名詞暫時無法展開。`
        : `OpenAlex 找不到與「${term}」相關、有公開摘要的${mode === 'recent' ? '近三年' : '高被引'}論文。為了確保內容來自可信來源，這個名詞暫時無法展開。`);
    }
    status(`正在請 ${modelLabel(fallbackChain(lv)[0])} 根據來源撰寫…`);
    const obj = await callGemini(sourcePrompt(src, lv, { term, parent: parent ? parent.title : '' }), signal, status, lv);
    return { obj, src };
  }, `正在展開「${term}」`, () => openTerm(term, english));
  if (!r) return;
  const card = normalize(r.obj, Object.assign({ kind:'term', parentId: parent ? parent.id : null,
    cat: parent ? parent.cat : '未分類', sub: parent ? parent.sub : null, level:lv }, sourcedExtra(r.src, mode)));
  card.title = term;
  if (english && !card.english) card.english = english;
  addCard(card);
  state.path.push(card.id);
  persist(); render(); window.scrollTo(0, 0);
}

// 重新產生被精簡的舊卡片：有來源紀錄的，回到同一個來源重新摘要
async function regen(c){
  if (!c) return;
  const lv = c.level || levelFor(c.cat);
  const parent = state.cards[c.parentId];
  const r = await run(async (signal, status) => {
    let src = null;
    if (c.srcKey && c.srcKey.startsWith('wiki:')){
      status('正在重新讀取維基百科條目…');
      src = await wikiArticle(c.srcKey.slice(5), signal, c.sources?.[0]?.author || '');
    } else if (c.srcKey && c.srcKey.startsWith('oa:')){
      status('正在重新讀取論文資料…');
      const w = await getJSON(`${OA_API}/works/${c.srcKey.slice(3)}?mailto=${OA_MAIL}`, signal, 'OpenAlex 學術資料庫');
      src = oaToSource(w, c.srcType === 'recent' ? 'recent' : 'classic');
    }
    if (!src && !c.srcKey) src = await getSource(modeFor(lv), c.english || c.title, signal, status, true);
    if (!src) throw new Error('找不到這張卡片的可信來源，無法重新產生。');
    const focus = c.kind === 'term' ? { term:c.title, parent: parent ? parent.title : '' } : null;
    const obj = await callGemini(sourcePrompt(src, lv, focus), signal, status, lv);
    return { obj, src };
  }, `正在重新產生「${c.title}」`, () => regen(c));
  if (!r) return;
  const fresh = normalize(r.obj, {});
  const target = state.cards[c.id] || c;
  Object.assign(target, { english: target.english || fresh.english, field: fresh.field || target.field,
    body: fresh.body, terms: fresh.terms, consensus: fresh.consensus, sources: r.src.sources,
    model: fresh.model, fallback: fresh.fallback });
  delete target.stub;
  target.updatedAt = Date.now();
  state.cards[target.id] = target;
  persist(); render();
}

1. 使用繁體中文與台灣學界慣用譯名，專有名詞可在括號附上英文。
2. 先給結論再解釋，回答精確、直接；一般問題約 150 到 400 字，學生要求詳細時再展開。
3. 區分已確立的知識與仍有爭議或尚在研究的部分；不確定時明確說不確定，不要杜撰引用、數據或文獻。
4. 數學式用 LaTeX：行內式寫在 $...$ 中，獨立式寫在 $$...$$ 中。

function mdLite(text){
  const out = []; let para = [], list = [];
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const flushP = () => { if (para.length){ out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const flushL = () => { if (list.length){ out.push('<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'); list = []; } };
  for (let line of esc(text).split('\n')){
    line = line.replace(/^#{1,6}\s+(.*)$/, '**$1**');
    const m = line.match(/^\s*[-*•]\s+(.*)$/);
    if (m){ flushP(); list.push(m[1]); }
    else if (!line.trim()){ flushP(); flushL(); }
    else { flushL(); para.push(line.trim()); }
  }
  flushP(); flushL();
  return out.join('');
}

function updateAsk(){
  const log = $('#asklog');

    html = `<p class="ask-empty">${current() ? '可以問任何問題，也可以針對目前這張卡片追問細節，例如推導過程、反例或實際應用。' : '可以問任何問題，例如請它解釋一個概念、比較兩個理論，或推導一條公式。'}</p>`;
  }
  html += a.msgs.map(m => m.role === 'user'
    ? `<div class="msg user">${esc(m.text)}</div>`
    : `<div class="msg model">${mdLite(m.text)}</div>`).join('');
  if (a.loading) html += `<div class="typing"><span>${esc(a.status || '正在思考')}</span><button class="btn sm sec" data-act="askcancel">取消</button></div>`;
  if (a.error) html += `<div class="notice" role="alert">${esc(a.error)}<div class="btns"><button class="btn sm" data-act="askretry">再試一次</button></div></div>`;
  log.innerHTML = html;

  const card = current();
  $('#askctx').innerHTML = card && !card.stub
    ? `<label class="ctx"><input type="checkbox" id="askctxbox" ${a.useCtx ? 'checked' : ''}><span>附上目前的卡片「${esc(card.title)}」作為背景</span></label>`
    : '';
  $('#asksend').disabled = a.loading;
  if (window.MathJax && MathJax.typesetPromise){
    MathJax.typesetClear && MathJax.typesetClear([log]);
    MathJax.typesetPromise([log]).then(() => { log.scrollTop = log.scrollHeight; }).catch(() => {});
  }
  log.scrollTop = log.scrollHeight;
}

function askSend(){
  const a = state.ask;
  const q = a.draft.trim();
  if (!q || a.loading) return;
  if (!state.settings.key.trim()){ toast('請先到設定填入 API 金鑰'); return; }
  a.msgs.push({ role:'user', text:q });
  a.draft = '';
  const input = $('#askinput');
  if (input){ input.value = ''; input.style.height = ''; }
  askCall();
}

async function askCall(){
  const a = state.ask;
  if (a.loading || !a.msgs.length) return;
  a.loading = true; a.error = ''; a.status = ''; a.controller = new AbortController();
  updateAsk();
  const card = current();
  let sys = ASK_SYSTEM;
  if (a.useCtx && card && !card.stub){
    sys += `\n\n學生目前正在閱讀以下知識卡片，問題可能與它有關：\n「${card.title}」（${card.field}）\n${plain(card.body)}`;
  }
  let hist = a.msgs.slice(-12);
  while (hist.length && hist[0].role !== 'user') hist = hist.slice(1);
  try{
    const text = await geminiSmart({
      systemInstruction:{ parts:[{ text:sys }] },
      contents: hist.map(m => ({ role:m.role, parts:[{ text:m.text }] })),
      generationConfig:{ temperature:0.7 }
    }, a.controller.signal, msg => { a.status = msg; updateAsk(); });
    a.msgs.push({ role:'model', text:text.trim() });
  }catch(e){
    if (e.name === 'AbortError'){
      const last = a.msgs.pop();
      if (last && last.role === 'user'){ a.draft = last.text; const i = $('#askinput'); if (i) i.value = last.text; }
    } else a.error = e.message;
  }finally{
    a.loading = false; a.controller = null;
    updateAsk();
  }
}

    <label class="check"><input type="checkbox" id="autofallback" ${s.autoFallback !== false ? 'checked' : ''}>忙碌時自動改用其他模型：伺服器忙碌或額度用完時，會先重試，再依序改用 3.7 Flash、3.5 Flash-Lite，並在卡片上標示</label>

        <p>在這個網頁裡，產生一張知識點、展開一個延伸名詞、重新產生內容、送出一次提問，各算 1 次請求。以 Flash 系列每日約 20 次來說，大概只夠看十幾張卡片，所以預設使用每日額度多出許多的 3.5 Flash-Lite；想要更深入的說明時，再切換到 Flash 系列即可。</p>

      </div>

  </section>
  <section class="group">

    <div class="seg">${LEVELS.map(l => `<button data-act="level" data-level="${l}" aria-pressed="${s.level === l}">${l}</button>`).join('')}</div>
    ${Object.keys(state.bias).filter(k => FIELDS[k]).length ? `<p class="biaslist">已個別調整：${Object.keys(state.bias).filter(k => FIELDS[k]).map(k => `${esc(k)} ${levelFor(k)}`).join('、')}
      <button class="btn sm sec" data-act="biasresetall" style="margin-left:6px">全部恢復預設</button></p>` : ''}
  </section>
  <section class="group">
    <h2>領域</h2>
    <p class="hint">${s.fields.length ? `只從選取的 ${s.fields.length} 個領域中隨機挑選。` : '目前從所有領域隨機挑選；點選可以縮小範圍。'}</p>
    <div class="chips">${cats}</div>

    <label class="lab" for="gclient">OAuth 用戶端 ID</label>
    <input class="input" id="gclient" style="width:100%" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${esc(state.drive.clientId)}">
    ${!state.drive.clientId ? '' : !rt.client ? '<p class="syncstat" style="color:var(--muted)">Google 登入元件載入中；若一直沒有出現按鈕，請確認網路連線後重新整理。</p>' : state.drive.connected ? `
      <p class="syncstat">${rt.busy ? '正在同步…' : `上次同步：${state.drive.lastSync ? fmtDateTime(state.drive.lastSync) : '尚未同步'}`}</p>
      <div class="btnrow">
        <button class="btn" data-act="drivesync" ${rt.busy ? 'disabled' : ''}>立即同步</button>
        <button class="btn sec" data-act="drivedisconnect">中斷連結</button>
      </div>

      <div class="btnrow" style="margin-top:12px"><button class="btn" data-act="drivesync" ${rt.busy ? 'disabled' : ''}>${rt.busy ? '正在同步…' : '連結 Google Drive 並同步'}</button></div>`}

    <p class="hint">也可以手動匯出成檔案；匯入時會和現有資料合併，不會覆蓋。目前共 ${Object.keys(state.cards).length} 張卡片。</p>
    <div class="btnrow">
      <button class="btn sec" data-act="export">匯出備份</button>
      <button class="btn sec" data-act="import">匯入備份</button>
      <button class="btn sec" data-act="clear" style="color:var(--warn)">清除所有卡片</button>
    </div>
  </section>`;
}

// ---------- knowledge map ----------
const rad = d => d === 0 ? 0 : d === 1 ? 140 : 420 + (d - 2) * 150;
const catOf = c => FIELDS[c.cat] ? c.cat : '未分類';

function buildTree(){
  const cards = Object.values(state.cards).sort((a, b) => a.createdAt - b.createdAt);
  const root = { type:'root', name:'知識', children:[] };
  const catNodes = {}, subNodes = {}, cardNodes = {};
  const cats = Object.keys(FIELDS);
  if (cards.some(c => catOf(c) === '未分類')) cats.push('未分類');
  cats.forEach((cat, i) => {
    const cn = { type:'cat', name:cat, cat, hue: Math.round(i * 360 / 16), sat: FIELDS[cat] ? '45%' : '0%', children:[] };
    catNodes[cat] = cn; root.children.push(cn);
    (FIELDS[cat] || []).forEach(sub => {
      const sn = { type:'sub', name:sub, cat, sub, children:[] };
      subNodes[cat + '|' + sub] = sn; cn.children.push(sn);
    });
  });
  for (const c of cards) cardNodes[c.id] = { type:'card', id:c.id, name:c.title, saved: state.saved.includes(c.id), children:[] };
  for (const c of cards){
    const n = cardNodes[c.id];
    const parent = c.parentId && c.parentId !== c.id && cardNodes[c.parentId];
    if (parent){ parent.children.push(n); continue; }
    const cat = catOf(c);
    (subNodes[cat + '|' + c.sub] || catNodes[cat]).children.push(n);
  }
  // 只顯示學過的子領域；16 個大領域永遠保留
  for (const cn of root.children) cn.children = cn.children.filter(n => n.type !== 'sub' || n.children.length);
  return root;
}

function renderTree(){
  const cards = Object.values(state.cards);
  const total = Object.values(FIELDS).reduce((s, a) => s + a.length, 0);
  const touched = new Set(cards.filter(c => FIELDS[c.cat] && c.sub).map(c => c.cat + '|' + c.sub)).size;
  const stat = cards.length ? `已學 ${cards.length} 個知識點，觸及 ${touched}／${total} 個子領域` : '還沒有學過任何知識點，點一個子領域開始';
  return `<div id="map" class="map"></div>
    <div class="mapbar"><span class="stat">${stat}</span><button class="btn sm sec" data-act="mapreset">回到中心</button></div>`;
}

function drawMap(){
  const host = $('#map');
  if (!host) return;
  if (!window.d3){ host.innerHTML = '<p class="maperr">地圖元件沒有載入，請確認網路連線後重新整理頁面。</p>'; return; }
  const w = host.clientWidth, h = host.clientHeight;
  const root = d3.hierarchy(buildTree(), d => d.children && d.children.length ? d.children : null);
  d3.tree().size([2 * Math.PI, 1]).separation((a, b) => (a.parent === b.parent ? 1 : 2) / Math.max(1, a.depth))(root);
  root.each(d => { d.y = rad(d.depth); });
  root.eachAfter(d => { d.cards = (d.data.type === 'card' ? 1 : 0) + (d.children || []).reduce((s, c) => s + c.cards, 0); });
  const tone = d => {
    const a = d.depth === 0 ? null : d.ancestors().find(x => x.depth === 1);
    return a ? `--h:${a.data.hue};--s:${a.data.sat}` : '--h:200;--s:40%';
  };
  const deg = d => d.x * 180 / Math.PI - 90;

  const svg = d3.select(host).append('svg')
    .attr('class', 'mapsvg').attr('width', w).attr('height', h)
    .attr('role', 'img').attr('aria-label', '知識樹地圖');
  const g = svg.append('g');
  g.append('g').selectAll('circle').data(d3.range(1, root.height + 1)).join('circle')
    .attr('class', 'ring').attr('r', rad);
  g.append('g').selectAll('path').data(root.links()).join('path')
    .attr('class', d => 'link' + (d.target.cards ? '' : ' off'))
    .attr('style', d => tone(d.target))
    .attr('d', d3.linkRadial().angle(d => d.x).radius(d => d.y));
  const node = g.append('g').selectAll('g').data(root.descendants()).join('g')
    .attr('class', d => `node ${d.data.type}${d.cards || d.depth === 0 ? '' : ' off'}${d.data.saved ? ' saved' : ''}`)
    .attr('style', tone)
    .attr('transform', d => `rotate(${deg(d)}) translate(${d.y},0)`)
    .on('click', (e, d) => { e.stopPropagation(); onNode(d); });
  node.append('circle').attr('class', 'hit').attr('r', d => d.depth === 0 ? 44 : 14);
  node.append('circle').attr('class', 'dot')
    .attr('r', d => ({ root:40, cat:7, sub:4.5, card:4 })[d.data.type] + (d.data.saved ? 1 : 0));
  node.append('text')
    .attr('dy', '0.34em')
    .attr('x', d => d.depth === 0 ? 0 : (d.x < Math.PI ? 1 : -1) * ({ cat:12, sub:9, card:8 })[d.data.type])
    .attr('text-anchor', d => d.depth === 0 ? 'middle' : d.x < Math.PI ? 'start' : 'end')
    .attr('transform', d => d.depth === 0 ? `rotate(${-deg(d)})` : d.x >= Math.PI ? 'rotate(180)' : null)
    .text(d => d.data.type === 'card' && d.data.name.length > 14 ? d.data.name.slice(0, 13) + '…' : d.data.name);

  const zoom = d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => {
    const k = e.transform.k;
    g.attr('transform', e.transform);
    svg.style('--fs', 1 / Math.min(1, Math.max(k, 0.45)));
    svg.classed('far', k < 0.8);
    state.mapT = { x: e.transform.x, y: e.transform.y, k };
  });
  svg.call(zoom).on('dblclick.zoom', null);
  svg.on('click', () => { if (state.sheet){ state.sheet = null; renderSheet(); } });
  const k0 = Math.max(0.25, Math.min(1.2, Math.min(w, h) / (2 * (rad(Math.max(1, Math.min(root.height, 2))) + 130))));
  const t = state.mapT
    ? d3.zoomIdentity.translate(state.mapT.x, state.mapT.y).scale(state.mapT.k)
    : d3.zoomIdentity.translate(w / 2, h / 2).scale(k0);
  svg.call(zoom.transform, t);
}

function onNode(d){
  const t = d.data.type;
  if (t === 'root'){ state.mapT = null; state.sheet = null; render(); return; }
  if (t === 'card'){
    state.path = lineage(d.data.id); state.view = 'explore'; state.sheet = null;
    persist(); render(); window.scrollTo(0, 0); return;
  }
  state.sheet = t === 'cat' ? { type:'cat', cat:d.data.cat } : { type:'sub', cat:d.data.cat, sub:d.data.sub };
  renderSheet();
}

function renderSheet(){
  const el = $('#sheet');
  const sh = state.sheet;
  if (state.view !== 'tree' || !sh){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const cards = Object.values(state.cards).filter(c => catOf(c) === sh.cat);
  const cardRow = c => `<button class="row" data-act="openpath" data-id="${c.id}">
      <div class="r1"><span class="t serif">${esc(c.title)}</span>${c.kind === 'term' ? '<span class="s">延伸名詞</span>' : ''}${c.doubt ? '<span class="s" style="color:var(--warn)">存疑</span>' : ''}</div>
      <div class="b">${fmtDate(c.createdAt)}</div></button>`;
  let head, sub, go = '', rows;
  if (sh.type === 'sub'){
    const list = cards.filter(c => c.sub === sh.sub).sort((a, b) => b.createdAt - a.createdAt);
    head = sh.sub;
    sub = `${sh.cat}，已學 ${list.length} 個知識點，目前難度：${levelFor(sh.cat)}`;
    go = `<button class="btn go" data-act="branch" data-cat="${esc(sh.cat)}" data-sub="${esc(sh.sub)}">在這個分支學一個新的</button>`;
    rows = list.map(cardRow).join('');
  } else if (!FIELDS[sh.cat]){
    head = sh.cat; sub = `${cards.length} 個無法判斷領域的舊卡片`;
    rows = cards.sort((a, b) => b.createdAt - a.createdAt).map(cardRow).join('');
  } else {
    const subs = FIELDS[sh.cat];
    const count = s => cards.filter(c => c.sub === s).length;
    head = sh.cat;
    sub = `已學 ${cards.length} 個知識點，觸及 ${subs.filter(count).length}／${subs.length} 個子領域`;
    const bias = state.bias[sh.cat] || 0;
    go = `<div class="lvline"><span>目前難度：<b>${levelFor(sh.cat)}</b>${bias ? `（預設 ${LEVELS[baseIdx()]}）` : ''}</span>${bias ? `<button data-act="biasreset" data-cat="${esc(sh.cat)}">恢復預設</button>` : ''}</div>
      <button class="btn go" data-act="branch" data-cat="${esc(sh.cat)}" data-sub="">從這個領域隨機學一個</button>`;
    rows = subs.map(s => `<button class="row" data-act="sheetsub" data-cat="${esc(sh.cat)}" data-sub="${esc(s)}">
      <div class="r1"><span class="t">${esc(s)}</span><span class="s">${count(s) ? `已學 ${count(s)} 個` : '尚未探索'}</span></div></button>`).join('');
  }
  el.innerHTML = `<div class="sheet-in">
    <div class="sheet-h"><div><h3>${esc(head)}</h3><p class="sub">${sub}</p></div>
    <button class="x" data-act="sheetclose">關閉</button></div>
    ${go}${rows ? `<div class="rows">${rows}</div>` : ''}</div>`;
}

function renderActions(){
  const bar = $('#actions');
  if (state.view !== 'explore' || !state.settings.key.trim()){ bar.hidden = true; return; }
  bar.hidden = false;
  const c = current();
  const isSaved = c && state.saved.includes(c.id);
  bar.innerHTML = `<div class="actions-in">
    <button class="btn" data-act="new" ${state.loading ? 'disabled' : ''}>${c ? '換一個<span class="opt">知識點</span>' : '取得知識點'}</button>
    <button class="btn sec icon${state.ask.open ? ' askon' : ''}" data-act="ask" aria-pressed="${state.ask.open}" aria-label="提問" title="提問">${ICONS.ask}</button>
    ${c ? `<button class="btn sec icon" data-act="save" aria-pressed="${!!isSaved}" aria-label="${isSaved ? '取消收藏' : '收藏'}" title="${isSaved ? '已收藏' : '收藏'}">${ICONS.library}</button>
    <button class="btn sec icon warnon" data-act="doubt" aria-pressed="${!!c.doubt}" aria-label="${c.doubt ? '取消存疑' : '標記存疑'}" title="存疑">${ICONS.doubt}</button>
    <button class="btn sec icon" data-act="vote" data-dir="1" aria-pressed="${c.vote === 1}" ${FIELDS[c.cat] ? '' : 'disabled'} aria-label="太簡單，下次${esc(c.cat)}更難" title="太簡單，下次更難">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><circle class="eye" cx="9" cy="10" r="1.1"/><circle class="eye" cx="15" cy="10" r="1.1"/><path d="M8.2 14.2q3.8 3.6 7.6 0"/></svg></button>
    <button class="btn sec icon" data-act="vote" data-dir="-1" aria-pressed="${c.vote === -1}" ${FIELDS[c.cat] ? '' : 'disabled'} aria-label="太難，下次${esc(c.cat)}更簡單" title="太難，下次更簡單">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><circle class="eye" cx="9" cy="10" r="1.1"/><circle class="eye" cx="15" cy="10" r="1.1"/><path d="M8.2 16.6q3.8 -3.4 7.6 0"/></svg></button>` : ''}
  </div>`;
}

function render(){
  renderNav();
  const main = $('#main');
  const tree = state.view === 'tree';
  if (!tree) state.sheet = null;
  if (state.view !== 'explore' && state.ask.open){ state.ask.open = false; renderAsk(); }
  document.documentElement.style.setProperty('--hh', $('.bar').offsetHeight + 'px');
  document.body.classList.toggle('maponly', tree);
  main.className = tree ? 'mapwrap' : 'wrap';
  main.innerHTML = tree ? renderTree() : state.view === 'library' ? renderLibrary() : state.view === 'settings' ? renderSettings() : renderExplore();
  renderActions();
  renderSheet();
  if (tree){ drawMap(); return; }
  if (window.MathJax && MathJax.typesetPromise){
    MathJax.typesetClear && MathJax.typesetClear([main]);
    MathJax.typesetPromise([main]).catch(() => {});
  }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const c = current();
  switch (act){
    case 'view': state.view = el.dataset.view; render(); window.scrollTo(0, 0); break;
    case 'new': newPoint(); break;
    case 'term': openTerm(el.dataset.term, el.dataset.en || (c?.terms.find(t => t.term === el.dataset.term)?.english) || ''); break;
    case 'trail': goTo(el.dataset.id); break;
    case 'open': case 'openpath':
      state.path = lineage(el.dataset.id); state.view = 'explore'; state.sheet = null;
      persist(); render(); window.scrollTo(0, 0); break;
    case 'branch':
      state.sheet = null;
      if (!state.settings.key.trim()){ state.view = 'settings'; render(); toast('請先設定 API 金鑰'); break; }
      state.view = 'explore'; render(); window.scrollTo(0, 0);
      newPoint({ cat: el.dataset.cat, sub: el.dataset.sub || null }); break;
    case 'sheetsub': state.sheet = { type:'sub', cat:el.dataset.cat, sub:el.dataset.sub }; renderSheet(); break;
    case 'sheetclose': state.sheet = null; renderSheet(); break;
    case 'mapreset': state.mapT = null; render(); break;
    case 'regen': regen(c); break;
    case 'vote': vote(c, Number(el.dataset.dir)); break;
    case 'theme': state.settings.theme = el.dataset.theme; saveSettings(); applyTheme(); render(); break;
    case 'drivesync': withToken(() => driveSync(false)); break;
    case 'drivedismiss': rt.dismissed = true; render(); break;
    case 'drivedisconnect':
      if (!confirm('要中斷與 Google Drive 的連結嗎？雲端上的備份會保留，之後重新連結即可繼續同步。')) break;
      if (rt.token && window.google) google.accounts.oauth2.revoke(rt.token, () => {});
      rt.token = null; state.drive.connected = false; state.drive.lastSync = 0; saveDrive();
      render(); toast('已中斷連結'); break;
    case 'biasreset':
      delete state.bias[el.dataset.cat]; state.biasAt = Date.now();
      persist(); renderSheet(); toast(`${el.dataset.cat}已恢復預設難度`); break;
    case 'biasresetall': state.bias = {}; state.biasAt = Date.now(); persist(); render(); toast('已全部恢復預設難度'); break;
    case 'ask': state.ask.open ? closeAsk() : openAsk(); break;
    case 'askclose': closeAsk(); break;
    case 'asksend': askSend(); break;
    case 'askretry': state.ask.error = ''; askCall(); break;
    case 'askcancel': state.ask.controller?.abort(); break;
    case 'askclear':
      state.ask.controller?.abort();
      state.ask.msgs = []; state.ask.error = ''; updateAsk(); break;
    case 'retry': if (state.retry) state.retry(); break;
    case 'dismiss': state.error = ''; render(); break;
    case 'cancel': state.controller?.abort(); break;
    case 'save':
      if (!c) break;
      if (state.saved.includes(c.id)){ state.saved = state.saved.filter(x => x !== c.id); state.savedLog[c.id] = { on:false, t:Date.now() }; toast('已取消收藏'); }
      else { state.saved.push(c.id); state.savedLog[c.id] = { on:true, t:Date.now() }; toast('已收藏'); }
      persist(); render(); break;
    case 'doubt':
      if (!c) break;
      c.doubt = !c.doubt; c.updatedAt = Date.now(); toast(c.doubt ? '已標記存疑' : '已取消存疑');
      persist(); render(); break;
    case 'togglekey': {
      const k = $('#key'); const show = k.type === 'password';
      k.type = show ? 'text' : 'password'; el.textContent = show ? '隱藏' : '顯示'; break;
    }
    case 'model': {
      state.settings.model = el.dataset.model; saveSettings();
      const open = $('.quota')?.open; render(); if (open) $('.quota').open = true;
      toast('已切換為 ' + (MODELS.find(m => m.id === el.dataset.model)?.name || el.dataset.model)); break;
    }
    case 'level': state.settings.level = el.dataset.level; saveSettings(); render(); break;
    case 'field': {
      const f = el.dataset.field, fs = state.settings.fields;
      state.settings.fields = fs.includes(f) ? fs.filter(x => x !== f) : [...fs, f];
      saveSettings(); render(); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(snapshot())], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `knowledge-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('已匯出備份'); break;
    }
    case 'import': $('#importFile').click(); break;
    case 'clear':
      if (!confirm(state.drive.connected
        ? '確定要清除這台裝置上的所有卡片、收藏與紀錄嗎？注意：Google Drive 上的備份不會被刪除，下次同步時會再合併回來。'
        : '確定要清除所有卡片、收藏與紀錄嗎？API 金鑰與設定會保留。')) break;
      state.cards = {}; state.saved = []; state.seen = []; state.termIndex = {}; state.path = [];
      persist(); render(); toast('已清除'); break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'askinput'){
    state.ask.draft = e.target.value;
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(150, e.target.scrollHeight + 2) + 'px';
    return;
  }
  if (e.target.id === 'key'){ state.settings.key = e.target.value; state.settings.keyAt = Date.now(); saveSettings(); renderActions(); scheduleSync(); }
});

$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try{
    const { added } = mergeBackup(JSON.parse(await file.text()));
    render(); toast(`已匯入，新增 ${added} 張卡片`);
  }catch{ toast('這不是有效的備份檔。'); }
});

document.addEventListener('change', e => {
  if (e.target.id === 'gclient'){ state.drive.clientId = e.target.value.trim() || DEFAULT_CLIENT_ID; saveDrive(); initGis(); render(); }
  if (e.target.id === 'autofallback'){ state.settings.autoFallback = e.target.checked; saveSettings(); }
  if (e.target.id === 'driveauto'){ state.drive.auto = e.target.checked; saveDrive(); }
  if (e.target.id === 'askctxbox') state.ask.useCtx = e.target.checked;
});
document.addEventListener('keydown', e => {
  if (!state.ask.open) return;
  if (e.key === 'Escape') closeAsk();
  if (e.target.id === 'askinput' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); askSend(); }
});

applyTheme();
if (window.google && google.accounts && google.accounts.oauth2) initGis();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && rt.timer && tokenValid()){ clearTimeout(rt.timer); driveSync(true); }
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.view === 'tree') render(); }, 200);
});

render();
})();
</script>
</body>
</html>
